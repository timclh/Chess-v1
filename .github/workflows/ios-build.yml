name: iOS Build

on:
  push:
    branches: [master]
  workflow_dispatch: # Allow manual trigger (runs the archive too, on any branch)

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # @capacitor/cli 8 engines.node is ">=22.0.0"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        id: install
        working-directory: frontend
        run: npm ci

      - name: Build React app
        id: react
        working-directory: frontend
        env:
          NODE_OPTIONS: '--openssl-legacy-provider'
          CI: false  # Don't treat warnings as errors
        run: npx react-scripts build

      - name: Sync Capacitor iOS
        id: sync
        working-directory: frontend
        run: npx cap sync ios

      # Note: `xcodebuild ... | tail` hides xcodebuild's exit code unless pipefail
      # is on (GitHub's default `bash -e` does not enable it), which used to turn
      # a failed build into a green step. Keep `set -o pipefail` in these steps.
      - name: Build iOS app (Simulator)
        id: simulator
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          # "generic" needs no specific device; named simulators come and go with
          # the runner image (iPhone 16 disappeared with macOS 26).
          xcodebuild build \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | tail -40

      - name: Build iOS app (Archive for device, unsigned)
        id: archive
        if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        working-directory: frontend/ios/App
        run: |
          set -o pipefail
          xcodebuild archive \
            -scheme App \
            -archivePath build/ChessArena.xcarchive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            | tail -40

      - name: Upload build artifact
        id: upload
        if: steps.archive.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: frontend/ios/App/build/ChessArena.xcarchive
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *) echo "❔" ;;
            esac
          }
          {
            echo "## iOS Build Summary"
            echo "- $(icon '${{ steps.install.outcome }}') Install dependencies (npm ci): ${{ steps.install.outcome }}"
            echo "- $(icon '${{ steps.react.outcome }}') React build: ${{ steps.react.outcome }}"
            echo "- $(icon '${{ steps.sync.outcome }}') Capacitor sync: ${{ steps.sync.outcome }}"
            echo "- $(icon '${{ steps.simulator.outcome }}') iOS simulator build: ${{ steps.simulator.outcome }}"
            echo "- $(icon '${{ steps.archive.outcome }}') iOS archive (unsigned): ${{ steps.archive.outcome }}"
            echo "- $(icon '${{ steps.upload.outcome }}') Artifact upload: ${{ steps.upload.outcome }}"
            echo ""
            echo "_The archive is unsigned: it proves the app compiles for a device, but it cannot be installed or uploaded to TestFlight._"
          } >> "$GITHUB_STEP_SUMMARY"
