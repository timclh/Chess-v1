name: Web CI & Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Tiangong TD & App tests
        working-directory: frontend
        env:
          CI: true
        run: npx react-scripts test --watchAll=false --env=jsdom src/TiangongTD.test.js src/App.test.js

      - name: Build production web bundle
        working-directory: frontend
        env:
          CI: true
          NODE_OPTIONS: '--openssl-legacy-provider'
        run: npm run build
