<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#f39422"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  <!-- Chess Queen silhouette -->
  <g transform="translate(256, 240)" fill="url(#accent)">
    <!-- Crown points -->
    <path d="M-90,60 L-110,-20 L-70,10 L-40,-50 L-10,10 L0,-70 L10,10 L40,-50 L70,10 L110,-20 L90,60 Z" fill="url(#accent)"/>
    <!-- Crown base -->
    <rect x="-95" y="60" width="190" height="25" rx="5" fill="url(#accent)"/>
    <!-- Crown bottom -->
    <rect x="-85" y="90" width="170" height="20" rx="5" fill="url(#accent)"/>
  </g>
  <!-- 棋 character -->
  <text x="256" y="420" text-anchor="middle" font-size="80" font-weight="700" fill="white" font-family="Arial, sans-serif">棋 Arena</text>
</svg>
